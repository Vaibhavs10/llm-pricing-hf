[tool.poetry]
name = "llm-pricing-hf"
version = "0.1.0"
description = "Scrapers for Hugging Face inference provider pricing"
authors = ["Codex Assistant <noreply@example.com>"]
readme = "README.md"
packages = [{include = "llm_pricing"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
requests = "^2.32.3"
beautifulsoup4 = "^4.14.2"
lxml = "^5.2.1"
tenacity = "^9.0.0"
huggingface-hub = "^0.26.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
